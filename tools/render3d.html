<!doctype html>
<html><head><meta charset="utf-8"><title>render3d</title>
<style>body{margin:0;background:#888}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
/* Renderer modeli z Meshy do klatek gry (uruchamiany przez tools/render3d.js w Chromium bez okna).
   Zwierzę: kamera ortograficzna z boku i lekko z góry, pyszczek w lewo, stopy w (0,0).
   Ruch jest proceduralny: nogi wahają się wokół bioder, szyja kiwa, ogon się kołysze, tułów lekko podskakuje.
   Wybieg: kamera izometryczna 2:1 jak w grze; warstwa „tył” (całość) i „przód” (tylko pas przy przednich krawędziach). */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);

function lights(scene, o = {}) {
  scene.add(new THREE.HemisphereLight(0xfff4dc, 0x5a5040, o.amb ?? 1.25));
  const sun = new THREE.DirectionalLight(0xfff0d8, o.sun ?? 2.1);
  sun.position.set(-6, 9, 5);                           // światło z lewej góry, jak w całej grze
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xc8d8ff, 0.35); fill.position.set(6, 3, -4); scene.add(fill);
}

async function load(url) {
  const g = await new GLTFLoader().loadAsync(url);
  const root = g.scene;
  root.traverse((m) => { if (m.isMesh) { m.material.side = THREE.DoubleSide; if (m.material.map) m.material.map.anisotropy = 8; } });
  return root;
}

function snap(w, h) { return renderer.domElement.toDataURL('image/png'); }

// ---------- zwierzę ----------
// o: { url, yaw (obrót, żeby pyszczek patrzył w -X), elev, az, h (wysokość w jednostkach gry), px (pikseli na jednostkę),
//      walkN, idleN, swing, legTop (0..1 wys.), neck, tail }
window.renderAnimal = async (o) => {
  const root = await load(o.url);
  const scene = new THREE.Scene(); lights(scene, o);
  root.updateMatrixWorld(true);
  // zbierz geometrię w jednym układzie, znormalizuj: stopy na y=0, środek w x/z, wysokość = 1
  const meshes = [];
  root.traverse((m) => { if (m.isMesh) meshes.push(m); });
  const holder = new THREE.Group(); scene.add(holder);
  const parts = meshes.map((m) => {
    const geo = m.geometry.clone(); geo.applyMatrix4(m.matrixWorld);
    const mesh = new THREE.Mesh(geo, m.material); holder.add(mesh); return mesh;
  });
  holder.rotation.y = o.yaw || 0; holder.updateMatrixWorld(true);
  parts.forEach((p) => { p.geometry.applyMatrix4(holder.matrixWorld); }); holder.rotation.y = 0; holder.updateMatrixWorld(true);
  const box = new THREE.Box3(); parts.forEach((p) => { p.geometry.computeBoundingBox(); box.union(p.geometry.boundingBox); });
  const H = box.max.y - box.min.y, cx = (box.min.x + box.max.x) / 2, cz = (box.min.z + box.max.z) / 2;
  parts.forEach((p) => { p.geometry.translate(-cx, -box.min.y, -cz); p.geometry.scale(1 / H, 1 / H, 1 / H); });
  const len = (box.max.x - box.min.x) / H, dep = (box.max.z - box.min.z) / H;
  // płaska podstawa pod kopytami (Meshy czasem ją dokleja): trójkąty leżące tuż przy ziemi zwijamy do punktu
  parts.forEach((p) => {
    const g = p.geometry.index ? p.geometry.toNonIndexed() : p.geometry; p.geometry = g;
    const a = g.attributes.position;
    for (let i = 0; i < a.count; i += 3) {
      if (a.getY(i) < 0.012 && a.getY(i + 1) < 0.012 && a.getY(i + 2) < 0.012) for (let k = 1; k < 3; k++) a.setXYZ(i + k, a.getX(i), a.getY(i), a.getZ(i));
    }
  });

  // wykrycie brzucha: najniższa wysokość, na której przekrój jest ciągły od przodu do tyłu
  const all = []; parts.forEach((p) => { const a = p.geometry.attributes.position; for (let i = 0; i < a.count; i++) all.push([a.getX(i), a.getY(i), a.getZ(i)]); });
  let legTop = o.legTop;
  if (legTop == null) {
    const NB = 24, x0 = -len / 2, mid = [];
    for (let s = 0.04; s < 0.9; s += 0.01) {
      const occ = new Array(NB).fill(0);
      all.forEach(([x, y]) => { if (Math.abs(y - s) < 0.01) occ[Math.min(NB - 1, Math.max(0, Math.floor((x - x0) / len * NB)))] = 1; });
      const on = occ.map((v, i) => [v, i]).filter(([v]) => v).map(([, i]) => i);
      if (!on.length) continue;
      const a = on[0], b = on[on.length - 1]; let gap = 0;
      for (let i = a; i <= b; i++) if (!occ[i]) gap++;
      mid.push([s, gap, b - a]);
      if (gap === 0 && b - a > NB * 0.3) { legTop = s; break; }
    }
    if (legTop == null) legTop = 0.4;
  }
  // przód/tył nóg: środki skupisk x przy ziemi
  const lowX = all.filter(([, y]) => y < Math.min(0.06, legTop * 0.2)).map(([x]) => x);   // tylko kopyta (ogon wisi wyżej)
  const lx0 = Math.min(...lowX), lx1 = Math.max(...lowX), splitX = (lx0 + lx1) / 2;
  const hipF = (lx0 + splitX) / 2, hipB = (splitX + lx1) / 2;       // pyszczek w -X: przód ma mniejsze x
  // głowa i szyja: wierzchołki przed przednimi nogami i wysoko; ogon: za tylnymi nogami
  const neckBase = new THREE.Vector3(hipF, legTop + (o.neckUp ?? 0.18), 0);
  const tailBase = new THREE.Vector3(lx1 + 0.02, legTop + 0.12, 0);

  const base = parts.map((p) => Float32Array.from(p.geometry.attributes.position.array));
  const smooth = (e0, e1, v) => { const t = Math.min(1, Math.max(0, (v - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
  function pose(mode, ph) {
    const walk = mode === 'walk', T = Math.PI * 2 * ph;
    const sw = o.swing ?? 0.42, pace = o.pace ?? false;      // żyrafa i wielbłąd chodzą inochodem
    const bob = walk ? -Math.abs(Math.sin(T)) * 0.012 : Math.sin(T) * 0.004;
    const nod = walk ? Math.sin(T * 2) * 0.05 : Math.sin(T) * (o.idleNod ?? 0.07);
    const tl = walk ? Math.sin(T * 2) * 0.25 : Math.sin(T * 2) * 0.35;
    parts.forEach((p, pi) => {
      const src = base[pi], a = p.geometry.attributes.position, arr = a.array;
      for (let i = 0; i < src.length; i += 3) {
        let x = src[i], y = src[i + 1], z = src[i + 2];
        // nogi
        const tailW = smooth(lx1 + 0.005, lx1 + 0.05, x) * smooth(legTop * 0.3, legTop * 0.6, y);   // ogon za tylnymi nogami
        if (walk && o.legs !== false && y < legTop + 0.04 && x > lx0 - 0.05 && tailW < 0.5 && !(o.legZ && Math.abs(z) < o.legZ && x > splitX)) {   // legZ: ogon wiszący na osi ciała
          const front = o.biped ? true : x < splitX, near = z > 0;   // dwunóg: nogi różnią się tylko stroną
          let phase = front ? 0 : (pace ? 0 : 0.5); if (!near) phase += 0.5;
          const ang = Math.sin(T + phase * Math.PI * 2) * sw * (front ? 1 : 0.9);
          const w = 1 - smooth(legTop - 0.1, legTop + 0.04, y);
          const hx = o.biped ? (lx0 + lx1) / 2 : (front ? hipF : hipB), hy = legTop + 0.02;
          const lift = Math.max(0, Math.cos(T + phase * Math.PI * 2)) * 0.035 * w * (1 - y / legTop);
          const c = Math.cos(ang * w), s = Math.sin(ang * w), dx = x - hx, dy = y - hy;
          x = hx + dx * c - dy * s; y = hy + dx * s + dy * c + lift;
        }
        // szyja i głowa (przed przednimi nogami, nad tułowiem)
        if (o.neck !== false && x < neckBase.x + 0.05 && y > neckBase.y) {
          const w = smooth(neckBase.y, neckBase.y + 0.25, y) * smooth(neckBase.x + 0.05, neckBase.x - 0.1, x);
          const c = Math.cos(nod * w), s = Math.sin(nod * w), dx = x - neckBase.x, dy = y - neckBase.y;
          x = neckBase.x + dx * c - dy * s; y = neckBase.y + dx * s + dy * c;
        }
        // ogon
        if (o.tail !== false && tailW > 0) {
          // sztywny obrót wokół nasady ogona (bez ścinania – kępka włosów się nie rozmazuje)
          const ang = Math.sin(tl) * 0.22 * tailW, c = Math.cos(ang), s = Math.sin(ang);
          const bx = lx1 + 0.03, by = legTop + 0.14, dx = x - bx, dy = y - by;
          x = bx + dx * c - dy * s; y = by + dx * s + dy * c;
        }
        if (y > legTop - 0.05) y += bob * smooth(legTop - 0.05, legTop + 0.05, y);
        // falowanie całego ciała (foka) i kołysanie na boki (pingwin)
        if (walk && o.wave) y += Math.sin(T - x * 9) * o.wave * smooth(0.0, 0.3, y);
        if (walk && o.waddle) { const a = Math.sin(T) * o.waddle, c = Math.cos(a), s2 = Math.sin(a); const zz = z * c - y * s2; y = z * s2 + y * c; z = zz; }
        arr[i] = x; arr[i + 1] = y; arr[i + 2] = z;
      }
      // błona między bliższą i dalszą nogą (Meshy skleja nogi): trójkąty rozciągnięte w ruchu chowamy
      if (walk) for (let i = 0; i < src.length; i += 9) {
        const d = (A, j, k) => Math.hypot(A[i + j] - A[i + k], A[i + j + 1] - A[i + k + 1], A[i + j + 2] - A[i + k + 2]);
        const o0 = Math.max(d(src, 0, 3), d(src, 3, 6), d(src, 0, 6)), n0 = Math.max(d(arr, 0, 3), d(arr, 3, 6), d(arr, 0, 6));
        if (n0 > o0 * 1.6 + 0.004) for (let k = 3; k < 9; k++) arr[i + k] = arr[i + k % 3];
      }
      a.needsUpdate = true; p.geometry.computeVertexNormals();
    });
  }

  // kamera: z boku (+Z patrzy na -Z), lekko z góry i odrobinę z przodu
  const px = o.px || 4, gameH = o.h, unit = gameH;          // 1 jednostka modelu = gameH jednostek gry
  const elev = (o.elev ?? 18) * Math.PI / 180, az = (o.az ?? 22) * Math.PI / 180;
  const margin = 0.06, halfW = len / 2 + 0.12, top = 1 + margin, bot = -0.08;
  const cam = new THREE.OrthographicCamera(-halfW, halfW, 1, -1, -10, 10);
  const dir = new THREE.Vector3(-Math.sin(az) * Math.cos(elev), Math.sin(elev), Math.cos(az) * Math.cos(elev));
  cam.position.copy(dir.multiplyScalar(5)); cam.lookAt(0, 0, 0); cam.updateMatrixWorld();
  // granice kadru w przestrzeni kamery
  const corners = []; const bb = new THREE.Box3(new THREE.Vector3(-len / 2 - 0.1, -0.02, -dep / 2 - 0.1), new THREE.Vector3(len / 2 + 0.1, 1.06, dep / 2 + 0.1));
  for (const X of [bb.min.x, bb.max.x]) for (const Y of [bb.min.y, bb.max.y]) for (const Z of [bb.min.z, bb.max.z]) corners.push(new THREE.Vector3(X, Y, Z).applyMatrix4(cam.matrixWorldInverse));
  const L = Math.min(...corners.map((c) => c.x)), R = Math.max(...corners.map((c) => c.x)), B = Math.min(...corners.map((c) => c.y)), Tt = Math.max(...corners.map((c) => c.y));
  cam.left = L; cam.right = R; cam.bottom = B; cam.top = Tt; cam.updateProjectionMatrix();
  const W = Math.ceil((R - L) * unit * px), Hh = Math.ceil((Tt - B) * unit * px);
  renderer.setSize(W, Hh, false);
  // punkt stóp (0,0,0) na obrazie
  const foot = new THREE.Vector3(0, 0, 0).applyMatrix4(cam.matrixWorldInverse);
  const meta = { w: W, h: Hh, px, fx: (foot.x - L) / (R - L) * W, fy: (Tt - foot.y) / (Tt - B) * Hh, legTop, len, splitX };
  const frames = { walk: [], idle: [] };
  for (const [mode, n] of [['walk', o.walkN || 12], ['idle', o.idleN || 16]]) for (let i = 0; i < n; i++) {
    pose(mode, i / n); renderer.render(scene, cam); frames[mode].push(snap());
  }
  return { meta, frames };
};

// ---------- wybieg ----------
// Romb miejsca w grze: połowy 112 × 56 (izometria 2:1). Model kładziemy tak, by jego podstawa wypełniła romb.
window.renderEnclosure = async (o) => {
  const root = await load(o.url);
  const scene = new THREE.Scene(); lights(scene, o);
  scene.add(root); root.updateMatrixWorld(true);
  // automatyczne prostowanie: obrót, przy którym podstawa (wierzchołki przy ziemi) ma najmniejszy prostokąt
  if (o.align !== false) {
    const b0 = new THREE.Box3().setFromObject(root), lim = b0.min.y + (b0.max.y - b0.min.y) * (o.baseH || 0.08), pts = [], v = new THREE.Vector3();
    root.traverse((m) => { if (!m.isMesh) return; const a = m.geometry.attributes.position; const step = Math.max(1, Math.floor(a.count / 20000));
      for (let i = 0; i < a.count; i += step) { v.fromBufferAttribute(a, i).applyMatrix4(m.matrixWorld); if (v.y < lim) pts.push([v.x, v.z]); } });
    let best = 0, bestA = Infinity;
    for (let d = -45; d < 45; d += 0.5) {
      const t = d * Math.PI / 180, c = Math.cos(t), s2 = Math.sin(t); let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
      for (const [x, z] of pts) { const X = x * c - z * s2, Z = x * s2 + z * c; if (X < x0) x0 = X; if (X > x1) x1 = X; if (Z < z0) z0 = Z; if (Z > z1) z1 = Z; }
      const A = (x1 - x0) * (z1 - z0); if (A < bestA) { bestA = A; best = t; }
    }
    o.alignedBy = best;
    root.rotation.y = -best + (o.yaw || 0);
  } else root.rotation.y = o.yaw || 0;
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  // podstawa mierzona tylko z wierzchołków przy ziemi (korona drzewa może wystawać poza ogrodzenie)
  const lowH = box.min.y + (box.max.y - box.min.y) * (o.baseH || 0.08), foot = new THREE.Box3(), v = new THREE.Vector3();
  root.traverse((m) => { if (!m.isMesh) return; const a = m.geometry.attributes.position; for (let i = 0; i < a.count; i++) { v.fromBufferAttribute(a, i).applyMatrix4(m.matrixWorld); if (v.y < lowH) foot.expandByPoint(v); } });
  const size = foot.getSize(new THREE.Vector3()), fc = foot.getCenter(new THREE.Vector3());
  // dopasowanie: podstawa (x, z) do kwadratu 1×1 (osobno w x i z, model bywa prostokątny), środek w (0,0), spód na y=0
  const fill = o.fill || 1;
  if (o.uniform) root.scale.setScalar(fill / Math.max(size.x, size.z));             // budynki: bez zniekształceń
  else root.scale.set(fill / size.x, fill / Math.max(size.x, size.z), fill / size.z); // wybiegi: podstawa = cały romb
  root.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(root);
  root.position.set(-fc.x * root.scale.x, -b2.min.y, -fc.z * root.scale.z); root.updateMatrixWorld(true);
  // obniżanie wysokich elementów (drzewa, bambusy, paśniki): wszystko powyżej squashFrom jest ściskane w pionie,
  // żeby wybieg nie zasłaniał tego, co stoi za nim. Wysokości w jednostkach świata (podstawa wybiegu = fill).
  if (o.squash && o.squash < 1) {
    const h0 = o.squashFrom ?? 0.25, kq = o.squash, v2 = new THREE.Vector3();
    root.traverse((m) => { if (!m.isMesh) return;
      m.geometry = m.geometry.clone(); const a = m.geometry.attributes.position, inv = new THREE.Matrix4().copy(m.matrixWorld).invert();
      for (let i = 0; i < a.count; i++) { v2.fromBufferAttribute(a, i).applyMatrix4(m.matrixWorld); if (v2.y > h0) { v2.y = h0 + (v2.y - h0) * kq; v2.applyMatrix4(inv); a.setXYZ(i, v2.x, v2.y, v2.z); } }
      a.needsUpdate = true; });
  }
  // izometria 2:1: azymut 45°, elewacja atan(0.5)≈26.57° (dimetria jak w grze)
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -20, 20);
  const el = Math.atan(0.5), az = Math.PI / 4;
  cam.position.set(Math.sin(az) * Math.cos(el) * 8, Math.sin(el) * 8, Math.cos(az) * Math.cos(el) * 8); cam.lookAt(0, 0, 0); cam.updateMatrixWorld();
  // romb (0.5,0,±0.5)… w kamerze: połowa szerokości = √2/2 → odpowiada 112 jednostkom gry (× o.fill, gdy model ma brzegi)
  const k = 112 / (Math.SQRT2 / 2) * (o.fill || 1);   // jednostek gry na jednostkę kamery
  const px = o.px || 3;
  // kadr jak płótna w look.js: x −130…130, y −150…90 (jednostki gry)
  const fx0 = -130, fx1 = 130, fy0 = -(o.top || 150), fy1 = 90;
  cam.left = fx0 / k; cam.right = fx1 / k; cam.top = -fy0 / k; cam.bottom = -fy1 / k; cam.updateProjectionMatrix();
  const W = Math.round((fx1 - fx0) * px), H = Math.round((fy1 - fy0) * px);
  renderer.setSize(W, H, false);
  renderer.render(scene, cam); const back = snap();
  if (o.noFront) return { meta: { w: W, h: H, px, x0: fx0, y0: fy0 }, back, front: null };
  // przód: pas przy przednich krawędziach (x > 0.5−d albo z > 0.5−d) i nad ziemią; dwa przebiegi złożone w jedno
  const d = o.band || 0.14, hmin = o.frontMin ?? 0.07;
  const pY = new THREE.Plane(new THREE.Vector3(0, 1, 0), -hmin);
  const pX = new THREE.Plane(new THREE.Vector3(1, 0, 0), -(0.5 * fill - d)), pZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), -(0.5 * fill - d));
  const mats = []; root.traverse((m) => { if (m.isMesh) { m.material = m.material.clone(); mats.push(m.material); } });
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const cg = cv.getContext('2d');
  for (const P of [pX, pZ]) { mats.forEach((m) => { m.clippingPlanes = [P, pY]; m.needsUpdate = true; }); renderer.render(scene, cam); cg.drawImage(renderer.domElement, 0, 0); }
  const front = cv.toDataURL('image/png');
  // podgląd ziemi: wysokość podłoża (do strojenia frontMin)
  return { meta: { w: W, h: H, px, x0: fx0, y0: fy0 }, back, front };
};
window.ready = true;
</script>
</body></html>
