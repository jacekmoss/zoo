<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moje Zoo">
  <meta name="theme-color" content="#24301f">
  <title>Moje Zoo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-512.png">
  <style>
    @font-face { font-family: 'Archivo Narrow'; font-style: normal; font-weight: 600 700; font-display: swap; src: url(fonts/archivo-narrow-700-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: 'Archivo Narrow'; font-style: normal; font-weight: 600 700; font-display: swap; src: url(fonts/archivo-narrow-700-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #5d7a42;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    canvas { display: block; position: fixed; inset: 0; touch-action: none; }
    #world { background: #5a7a3f; }
  </style>
</head>
<body>
  <canvas id="world"></canvas>
  <canvas id="game"></canvas>
  <script src="gl2d.js"></script>
  <script src="assets.js"></script>
  <script src="look.js"></script>
  <script src="sprites/index.js"></script>
  <script src="sprites2/index.js"></script>
  <script src="animals.js"></script>
  <script src="game.js"></script>
  <script>
    // działanie bez internetu (tylko przez http/https, nie z pliku otwartego dwuklikiem)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
  <script>window.gryHomeVisible = () => !window.__zoo || window.__zoo.S.scene === 'title';</script>
  <script src="/home.js" data-corner="tl" defer></script>
</body>
</html>
